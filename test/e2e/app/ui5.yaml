specVersion: "4.0"
metadata:
    name: cli-validation-app
type: application
server:
    customMiddleware:
        - name: ui5-middleware-ws-mock
          afterMiddleware: compression
          configuration:
              routes:
                  - mountPath: /ws/echo
                    handler: wsmock/handlers/echo.ts
                  - mountPath: /ws/notify/:userId
                    handler: wsmock/handlers/notify.ts
