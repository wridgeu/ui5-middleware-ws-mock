name: CLI Validation

# Boots a real `ui5 serve` with the packed middleware under each supported
# @ui5/cli major and asserts the WebSocket wire end-to-end. The unit suite mocks
# the tooling harness; this job proves the runtime contract against the actual CLI.
#
# A failure blocks the PR. The workflow tests the stable `latest` @ui5/cli line.

on:
    pull_request:
        branches: [main]
    workflow_dispatch:
    schedule:
        # Weekly, so a new @ui5/cli release that breaks the contract surfaces on
        # its own rather than waiting for the next PR.
        - cron: "0 6 * * 1"

concurrency:
    group: cli-validation-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    validate-cli:
        name: validate-cli (@ui5/cli ${{ matrix.cli }}, ${{ matrix.os }}, node ${{ matrix.node }})
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                node: [22, 24]
                cli: [latest]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 15
        env:
            UI5_CLI_VERSION: ${{ matrix.cli }}
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm

            - run: npm ci

            - name: Validate against @ui5/cli ${{ matrix.cli }}
              run: npm run validate:cli
