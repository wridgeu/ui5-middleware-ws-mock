name: CLI Validation

# Boots a real `ui5 serve` with the packed middleware under the stable (`latest`)
# @ui5/cli release and asserts the WebSocket wire end-to-end. The unit suite mocks
# the tooling harness; this job proves the runtime contract against the actual CLI.
#
# Add a leg to the matrix to cover another CLI line. A failure only blocks a PR if
# this check is marked required in the branch protection rules.
# Do not mark it required: the `paths` filter below skips docs-only PRs, and a skipped
# required check stays pending forever.

on:
    pull_request:
        branches: [main]
        # Skip docs-only changes; this job installs a full CLI and is slow on Windows.
        paths:
            - "src/**"
            - "test/e2e/**"
            - "ui5.yaml"
            - "tsconfig.json"
            - "package.json"
            - "package-lock.json"
            - ".github/workflows/cli-validation.yml"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: cli-validation-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    validate-cli:
        name: validate-cli (@ui5/cli ${{ matrix.cli }}, ${{ matrix.os }}, node ${{ matrix.node }})
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                node: [24]
                cli: [latest]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 15
        env:
            UI5_CLI_VERSION: ${{ matrix.cli }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm

            - run: npm ci

            - name: Validate against @ui5/cli ${{ matrix.cli }}
              run: npm run validate:cli
